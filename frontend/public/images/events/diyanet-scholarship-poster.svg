  </text>

  <!-- Divider -->
  <rect x="240" y="424" width="320" height="4" rx="2" fill="url(#tdvGold)" />

  <!-- Program Levels -->
  <rect x="80" y="460" width="640" height="90" rx="18" fill="#000000" fill-opacity="0.25" stroke="#ffffff" stroke-opacity="0.18" />
  <text x="400" y="500" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="800">
