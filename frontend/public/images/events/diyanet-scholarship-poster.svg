  </text>

  <!-- Benefits Grid -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#ffffff">
    <rect x="80" y="582" width="305" height="84" rx="14" fill="#ffffff" fill-opacity="0.1" />
    <text x="232" y="620" text-anchor="middle" fill="#fde68a">✓ Beca Académica Total</text>
    <text x="232" y="648" text-anchor="middle" font-size="16" font-weight="500" fill="#ccfbf1">Full Tuition &amp; Materials</text>

    <rect x="415" y="582" width="305" height="84" rx="14" fill="#ffffff" fill-opacity="0.1" />
    <text x="567" y="620" text-anchor="middle" fill="#fde68a">✓ Residencia Estudiantil</text>
    <text x="567" y="648" text-anchor="middle" font-size="16" font-weight="500" fill="#ccfbf1">TDV Dormitory &amp; Meals</text>

    <rect x="80" y="684" width="305" height="84" rx="14" fill="#ffffff" fill-opacity="0.1" />
    <text x="232" y="722" text-anchor="middle" fill="#fde68a">✓ Árabe y Turco</text>
    <text x="232" y="750" text-anchor="middle" font-size="16" font-weight="500" fill="#ccfbf1">Prep Year &amp; Seminars</text>

    <rect x="415" y="684" width="305" height="84" rx="14" fill="#ffffff" fill-opacity="0.1" />
    <text x="567" y="722" text-anchor="middle" fill="#fde68a">✓ Vuelos y Seguro</text>
    <text x="567" y="750" text-anchor="middle" font-size="16" font-weight="500" fill="#ccfbf1">Annual Flights &amp; Health Care</text>
  </g>

  <!-- Application Window Callout -->
  <rect x="80" y="804" width="640" height="128" rx="20" fill="url(#tdvGold)" />
  <text x="400" y="852" text-anchor="middle" fill="#042f2e" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="1.5">
