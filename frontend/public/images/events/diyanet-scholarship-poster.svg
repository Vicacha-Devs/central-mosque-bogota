  </text>
  <text x="400" y="1032" text-anchor="middle" fill="#99f6e4" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">
    Aval y Orientación • Mezquita Central Abu Bakr As-Siddiq de Bogotá
  </text>
