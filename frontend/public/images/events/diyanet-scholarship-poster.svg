<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1120" width="800" height="1120" role="img" aria-label="TDV Diyanet Bursları Scholarship Poster">
  <defs>
    <linearGradient id="tdvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="55%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="tdvGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
  </defs>

  <rect width="800" height="1120" fill="url(#tdvBg)" rx="24" />
  <circle cx="120" cy="160" r="240" fill="#ffffff" fill-opacity="0.04" />
  <circle cx="680" cy="960" r="280" fill="#2dd4bf" fill-opacity="0.07" />

  <!-- Top Header Badge -->
  <rect x="60" y="56" width="680" height="64" rx="32" fill="#ffffff" fill-opacity="0.12" stroke="#5eead4" stroke-opacity="0.35" />
  <text x="400" y="96" text-anchor="middle" fill="#fef3c7" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="800" letter-spacing="2.5">
    TÜRKİYE DİYANET VAKFI • TDV BURSLARI
  </text>

  <!-- Mosque Dome & Book Emblem -->
  <circle cx="400" cy="220" r="64" fill="#ffffff" fill-opacity="0.12" stroke="url(#tdvGold)" stroke-width="3" />
  <path d="M360 238 C360 198 400 176 400 176 C400 176 440 198 440 238 Z" fill="#fde68a" />
  <rect x="352" y="242" width="96" height="12" rx="6" fill="#ffffff" />

  <!-- Main Title -->
  <text x="400" y="348" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900">
