  </text>
  <text x="400" y="902" text-anchor="middle" fill="#7f1d1d" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900">
    10 ENERO – 20 FEBRERO
  </text>

  <!-- Footer -->
  <text x="400" y="988" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800">
    turkiyeburslari.gov.tr
  </text>
  <text x="400" y="1032" text-anchor="middle" fill="#fecaca" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">
    Orientación Gratuita • Mezquita Central Abu Bakr As-Siddiq de Bogotá
  </text>
</svg>
