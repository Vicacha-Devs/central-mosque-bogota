  </text>

  <!-- Benefits Grid -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#ffffff">
    <rect x="80" y="582" width="305" height="84" rx="14" fill="#ffffff" fill-opacity="0.1" />
    <text x="232" y="620" text-anchor="middle" fill="#fde68a">✓ Matrícula 100%</text>
    <text x="232" y="648" text-anchor="middle" font-size="16" font-weight="500" fill="#fee2e2">University Tuition Covered</text>

    <rect x="415" y="582" width="305" height="84" rx="14" fill="#ffffff" fill-opacity="0.1" />
    <text x="567" y="620" text-anchor="middle" fill="#fde68a">✓ Tiquetes Aéreos</text>
    <text x="567" y="648" text-anchor="middle" font-size="16" font-weight="500" fill="#fee2e2">Round-Trip Flight Tickets</text>

    <rect x="80" y="684" width="305" height="84" rx="14" fill="#ffffff" fill-opacity="0.1" />
    <text x="232" y="722" text-anchor="middle" fill="#fde68a">✓ Alojamiento y Salud</text>
    <text x="232" y="750" text-anchor="middle" font-size="16" font-weight="500" fill="#fee2e2">Dormitory &amp; Health Insurance</text>

    <rect x="415" y="684" width="305" height="84" rx="14" fill="#ffffff" fill-opacity="0.1" />
    <text x="567" y="722" text-anchor="middle" fill="#fde68a">✓ Estipendio + Idioma</text>
    <text x="567" y="750" text-anchor="middle" font-size="16" font-weight="500" fill="#fee2e2">Monthly Stipend + 1 Yr Turkish</text>
  </g>

  <!-- Application Window Callout -->
  <rect x="80" y="804" width="640" height="128" rx="20" fill="url(#goldAccent)" />
  <text x="400" y="852" text-anchor="middle" fill="#450a0a" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="1.5">
