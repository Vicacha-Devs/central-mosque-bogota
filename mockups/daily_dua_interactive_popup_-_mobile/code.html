<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Daily Dua Interactive Popup - Central Mosque of Bogotá</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#202d7e",
                        "primary-red": "#C13026",
                        "sand-card": "#f4ede4",
                        "background-light": "#f6f6f8",
                        "background-dark": "#13151f",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"],
                        "arabic": ["Amiri", "serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>.glass-overlay {
    background: rgba(19, 21, 31, 0.8);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px)
    }
.islamic-pattern {
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuAwElagS2NihfRBncrlhIkvfP8VDx67a2tZad9TYGPrPdZVNDa2q4iCb80zwdLHSH15pW7o6mwmuxp00-HsdEy8xQyg5DmpXBFrS8yXWjNgb-Eu1xwgimdawdjnlk7tdafgm-aQqpkrfDL8pzJf_-pdSCnwnieTB5PtXtOG11iRuCa6ZAJpRBG6RJleJZfGKsKNbQCrN5y76JlzzTYOx-JBVZ0Ui9Tv6KZSz5N-DsAK3wHJSjJiqafey1AblmMP1Zqe22hqRHeXMv8);
    opacity: 0.05
    }</style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white antialiased overflow-hidden">
<!-- Mobile Screen Wrapper (365px Simulation) -->
<div class="relative mx-auto h-screen w-full max-w-[365px] flex flex-col bg-[#121317] overflow-hidden">
<!-- Mock Background Content (The Home Screen being blurred) -->
<div class="flex-1 p-6 opacity-30 grayscale pointer-events-none">
<header class="flex items-center justify-between mb-8">
<div class="size-8 bg-primary rounded-full"></div>
<span class="material-symbols-outlined">menu</span>
</header>
<div class="space-y-4">
<div class="h-40 w-full bg-primary/20 rounded-xl"></div>
<div class="h-6 w-3/4 bg-white/10 rounded"></div>
<div class="h-4 w-1/2 bg-white/10 rounded"></div>
<div class="grid grid-cols-2 gap-4">
<div class="h-24 bg-white/5 rounded-lg"></div>
<div class="h-24 bg-white/5 rounded-lg"></div>
</div>
</div>
</div>
<!-- Full Screen Glassmorphism Overlay -->
<div class="absolute inset-0 glass-overlay flex items-end justify-center z-50">
<!-- Daily Dua Card (Sand Colored) -->
<div class="w-full bg-sand-card rounded-t-xl p-6 shadow-2xl relative animate-slide-up">
<!-- Swipe Handle -->
<div class="absolute top-3 left-1/2 -translate-x-1/2 w-12 h-1.5 bg-slate-400/30 rounded-full"></div>
<!-- Header Content -->
<div class="mt-4 mb-6 flex justify-between items-start">
<div>
<h2 class="text-primary text-xs font-extrabold uppercase tracking-widest leading-none">Daily Spiritual Reminder</h2>
<p class="text-slate-600 text-sm font-medium mt-1">Ramadan 15, 1445 AH</p>
</div>
<div class="text-primary">
<span class="material-symbols-outlined text-2xl">mosque</span>
</div>
</div>
<!-- Main Dua Content Area -->
<div class="relative bg-white/40 rounded-lg p-5 border border-white/60 overflow-hidden">
<!-- Subtle Decorative Islamic Pattern Background -->
<div class="absolute inset-0 islamic-pattern pointer-events-none"></div>
<div class="relative z-10 text-center">
<h1 class="font-arabic text-3xl font-bold text-slate-900 mb-4 leading-relaxed tracking-normal" dir="rtl">
                            اللَّهُمَّ إِنَّكَ عَفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي
                        </h1>
<!-- Decorative Islamic Divider -->
<div class="flex items-center justify-center gap-3 my-4">
<div class="h-px w-8 bg-slate-300"></div>
<span class="material-symbols-outlined text-primary/40 text-sm">star_rate</span>
<div class="h-px w-8 bg-slate-300"></div>
</div>
<p class="text-slate-800 text-base font-semibold leading-snug">
                            "O Allah, You are Most Forgiving, and You love forgiveness; so forgive me."
                        </p>
<p class="text-slate-500 text-xs mt-2 italic">
                            Reported by Aisha (RA) • Sunan at-Tirmidhi
                        </p>
</div>
</div>
<!-- Audio Player Interaction -->
<div class="mt-6 space-y-3">
<div class="flex items-center gap-4 bg-white/80 p-3 rounded-lg border border-slate-200">
<button class="size-10 flex items-center justify-center rounded-full bg-primary text-white shadow-lg">
<span class="material-symbols-outlined fill-1">play_arrow</span>
</button>
<div class="flex-1">
<div class="flex justify-between items-center mb-1">
<span class="text-[10px] font-bold text-slate-500">RECITATION BY IMAM</span>
<span class="text-[10px] font-bold text-slate-400">0:45</span>
</div>
<div class="h-1.5 w-full bg-slate-200 rounded-full overflow-hidden">
<div class="h-full bg-primary w-1/3 rounded-full"></div>
</div>
</div>
</div>
</div>
<!-- Action Row -->
<div class="mt-6 flex gap-3">
<button class="flex-1 flex items-center justify-center gap-2 h-14 bg-primary text-white rounded-lg font-bold text-sm shadow-md hover:bg-primary/90 transition-colors">
<span class="material-symbols-outlined text-xl">share</span>
                        Share Dua
                    </button>
<button class="flex-1 flex items-center justify-center gap-2 h-14 border-2 border-primary text-primary rounded-lg font-bold text-sm transition-colors">
<span class="material-symbols-outlined text-xl">bookmark</span>
                        Save
                    </button>
<button class="size-14 flex items-center justify-center bg-white border border-slate-200 rounded-lg shadow-sm">
<span class="material-symbols-outlined text-primary-red fill-1 text-2xl">favorite</span>
</button>
</div>
<!-- Footer / Close -->
<div class="mt-6 text-center pb-2">
<button class="text-slate-400 text-xs font-bold uppercase tracking-widest">
                        Swipe down to dismiss
                    </button>
</div>
</div>
</div>
</div>
<!-- Background Images for Context (Hidden placeholders) -->
<div class="hidden">

</div>
</body></html>
